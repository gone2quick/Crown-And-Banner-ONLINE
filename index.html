function shrink(a,l){for(const t in a.army)if(t!='boat')a.army[t]=Math.round(a.army[t]*(1-l));if(!sum(a.army))kill(a)}
function pass(a,j){const T=S.p[j];if(T.t=='ocean')return boardOK(a,j);if(T.o>=0&&T.o!=a.o&&S.n[T.o].war[a.o]==null&&!S.n[a.o].al[T.o])return false;return true}
function bfs(a,goal){const s=a.at,pv={[s]:-1},q=[s];while(q.length){const c=q.shift();if(c!=s&&goal(c)){const p=[];for(let x=c;x!=s;x=pv[x])p.unshift(x);return p}for(const j of nb(c)){if(j in pv||!pass(a,j))continue;pv[j]=c;q.push(j)}}return null}
function boardOK(a,j){const c=S.sh.filter(h=>h.o==a.o&&h.at==j).reduce((q,h)=>q+CAP[h.lv||0],0);if(!c)return false;const u=S.a.filter(x=>x!==a&&x.o==a.o&&x.at==j).reduce((q,x)=>q+landU(x),0);return u+landU(a)<=c}
function carried(h){let rem=CAP[h.lv||0];const l=[];S.a.filter(a=>a.o==h.o&&a.at==h.at).sort((x,y)=>x.id-y.id).forEach(a=>{const u=landU(a);if(u<=rem){rem-=u;l.push(a)}});return l}
function bfsS(h,to){const s=h.at,pv={[s]:-1},q=[s],blk=(x,j)=>x.at==j&&x.o!=h.o&&S.n[x.o].war[h.o]==null&&!S.n[h.o].al[x.o];while(q.length){const c=q.shift();if(c==to){const p=[];for(let x=c;x!=s;x=pv[x])p.unshift(x);return p}for(const j of nb(c)){if(j in pv||S.p[j].t!='ocean'||S.a.some(x=>blk(x,j))||S.sh.some(x=>blk(x,j)))continue;pv[j]=c;q.push(j)}}return null}
function orderShip(id,to){const h=S.sh.find(x=>x.id==id);if(!h||h.o!=0)return;if(S.p[to].t!='ocean')return toast('Boats can only move on water');if(to==h.at){h.path=[];return render()}const p=bfsS(h,to);if(!p)return toast('No sea route');h.path=p;render()}
function stepShip(h){if(!S.sh.includes(h)||!h.path.length)return;const nx=h.path[0],cr=carried(h),fa=S.a.filter(x=>x.at==nx&&S.n[x.o].war[h.o]!=null),fs=S.sh.filter(x=>x.at==nx&&S.n[x.o].war[h.o]!=null);
 if(fa.length||fs.length){const atk={boat:1},def={boat:fs.length};cr.forEach(x=>{for(const t in x.army)atk[t]=(atk[t]||0)+x.army[t]});fa.forEach(x=>{for(const t in x.army)def[t]=(def[t]||0)+x.army[t]});
  const ap=pw(atk,def,'a')*(.85+Math.random()*.3),dp=pw(def,atk,'d')*(.85+Math.random()*.3),win=ap>dp;
  if(h.o==0||(fa[0]&&fa[0].o==0)||(fs[0]&&fs[0].o==0))lg(`Sea battle: ${win?'victory':'defeat'} (power ${Math.round(ap)} vs ${Math.round(dp)})`);
  if(win){fa.forEach(kill);S.sh=S.sh.filter(x=>!fs.includes(x));cr.forEach(x=>shrink(x,Math.min(.5,Math.max(.1,.4/(ap/Math.max(dp,.1))))))}else{cr.forEach(kill);S.sh=S.sh.filter(x=>x!==h);return}}
 h.path.shift();h.at=nx;cr.forEach(x=>{if(S.a.includes(x)){x.at=nx;x.path=[];x.cap=null}})}
function strand(){const u={};S.a.slice().sort((x,y)=>x.id-y.id).forEach(a=>{if(S.p[a.at].t!='ocean')return;const k=a.o+'_'+a.at,c=S.sh.filter(h=>h.o==a.o&&h.at==a.at).reduce((q,h)=>q+CAP[h.lv||0],0);u[k]=(u[k]||0)+landU(a);if(u[k]>c){if(a.o==0)lg('An army was lost at sea!');kill(a)}})}
function goMenu(){if(S&&!S.over&&!S.setup){save(0,1);toast('Game autosaved')}menu()}
function fight(a,foes,ti){const T=S.p[ti],D=S.n[foes[0].o],A=S.n[a.o],def={};foes.forEach(f=>{for(const t in f.army)def[t]=(def[t]||0)+f.army[t]});
 const ap=pw(a.army,def,'a')*(1+(A.t.steel?.15:0))*(.85+Math.random()*.3);
 const dp=pw(def,a.army,'d')*(1+TERR[T.t].d+(T.v?.2+.1*(T.v.l||0)+ldef(T.v):0)+(D.cap==ti?.3:0)+(D.t.castles?.25:0))*(.85+Math.random()*.3),ratio=ap/Math.max(dp,.1),win=ratio>1;
 if(win){foes.forEach(kill);shrink(a,Math.min(.6,Math.max(.1,.5/ratio)))}else{foes.forEach(f=>shrink(f,Math.min(.6,Math.max(.1,.5*ratio))));kill(a)}
 clampRel(A,D,-10);if(a.o==0||D.id==0)lg(`Battle at ${T.nm}: ${A.nm} ${win?'wins':'is destroyed'} (power ${Math.round(ap)} vs ${Math.round(dp)})`);return win}
function conquer(aid,ti){const T=S.p[ti],pv=T.o,D=S.n[pv];T.o=aid;if(T.v){T.v.lord=aid?lord():null;if(!aid)S.lq.push(ti)}if(aid==0&&!T.v)S.pend.push(ti);clampRel(S.n[aid],D,-20);lg(`${S.n[aid].nm} seized ${T.nm}${T.v?' (village)':''} from ${D.nm}`);
 if(D.cap==ti){const r=tilesOf(pv).filter(i=>S.p[i].v);D.cap=r.length?r[0]:-1}
 if(!tilesOf(pv).length){D.dead=true;S.a=S.a.filter(x=>x.o!=pv);S.sh=S.sh.filter(x=>x.o!=pv);S.n.forEach(n=>{delete n.war[pv];delete n.al[pv]});lg(`${D.nm} is destroyed!`)}}
function step(a){if(!S.a.includes(a)||!a.path.length)return;const nx=a.path[0],T=S.p[nx];if(!pass(a,nx)){a.path=[];return}
 const foes=S.a.filter(b=>b.at==nx&&b.o!=a.o&&S.n[b.o].war[a.o]!=null);if(foes.length&&!fight(a,foes,nx)){return}
 a.path.shift();a.at=nx;a.cap=null}
function capable(a){const T=S.p[a.at];return T.t!='ocean'&&(T.o<0||(T.o!=a.o&&S.n[T.o].war[a.o]!=null&&!S.a.some(b=>b.at==a.at&&b.o==T.o)))}
function settle(){S.a.slice().forEach(a=>{const T=S.p[a.at];if(a.path.length||!capable(a)){a.cap=null;return}
 if(a.cap==null){if(a.o)a.cap=3;else return}
 if(--a.cap<=0){a.cap=null;if(T.o<0){T.o=a.o;if(a.o==0)S.pend.push(a.at);lg(`${S.n[a.o].nm} claimed ${T.nm}`)}else conquer(a.o,a.at)}})}
function order(id,to){const a=S.a.find(x=>x.id==id);if(!a||a.o!=0)return;if(to==a.at){a.path=[];return render()}const p=bfs(a,c=>c==to);if(!p)return toast('No route (enemy borders need war, sea needs boats)');a.path=p;render()}
function setPeace(a,b){const A=S.n[a],B=S.n[b];delete A.war[b];delete B.war[a];A.tr[b]=B.tr[a]=8;A.rel[b]=B.rel[a]=-10}
function declare(a,b){const A=S.n[a],B=S.n[b];delete A.al[b];delete B.al[a];A.war[b]=0;B.war[a]=0;clampRel(A,B,-60);lg(`${A.nm} declared war on ${B.nm}!`)}
function neigh(id){const s=new Set();S.p.forEach((p,i)=>{if(p.o==id)nb(i).forEach(j=>{const o=S.p[j].o;if(o>=0&&o!=id)s.add(o)})});return[...s]}
function ai(n){applyInc(n);
 for(const r of['f','i','w']){const th={f:150,i:80,w:100}[r];let k=0;while(n[r]>th+10&&k<3){n[r]-=10;n.g+=Math.round(price(r)*.8);S.mk.s[r]++;k++}}
 if(S.turn%5==0){const av=TECH.filter(t=>!n.t[t.id]);if(av.length)n.t[rn(av).id]=true}
 const mine=tilesOf(n.id),nov=mine.filter(i=>!S.p[i].v);
 if(nov.length&&n.g>110&&n.w>30&&Math.random()<.4){n.g-=60;n.w-=20;S.p[rn(nov)].v={b:[],lord:lord()}}
 mine.filter(i=>S.p[i].v).forEach(i=>{const v=S.p[i].v,vl=v.l||0;if(vl<3&&can(n,UPC[vl],1)&&n.g>UPC[vl].g+80&&Math.random()<.12){pay(n,UPC[vl],1);v.l=vl+1}if(used(v)<slots(v)&&n.g>90&&n.w>25&&Math.random()<.3){const k=rn(Object.keys(BLD));pay(n,BLD[k].c,1);(v.q=v.q||[]).push({k,t:BLD[k].t})}
  const ty=['levy','spear','archer'];if(n.t.chiv)ty.push('knight');const t=rn(ty);if(n.g>50&&can(n,U[t].c,5)&&Math.random()<.6){pay(n,U[t].c,5);addUnits(n.id,i,t,5)}});
 if(!Object.keys(n.war).length&&troops(n)>=15&&Math.random()<.06){const c=neigh(n.id).filter(j=>!S.n[j].dead&&!n.al[j]&&!(n.tr[j]>0)&&n.rel[j]<20&&pwr(S.n[j])<pwr(n)*1.1);if(c.length)declare(n.id,rn(c))}
 for(const j in n.war)if(+j!=0&&n.war[j]>=8&&Math.random()<.15){setPeace(n.id,+j);lg(`${n.nm} and ${S.n[j].nm} made peace.`)}
 const tg=new Set();S.a.filter(a=>a.o==n.id&&!a.path.length&&landU(a)>=8&&!capable(a)).forEach(a=>{const atwar=Object.keys(n.war).length;
  let p=atwar?bfs(a,c=>S.p[c].o>=0&&n.war[S.p[c].o]!=null):null;if(!p)p=bfs(a,c=>S.p[c].o<0&&S.p[c].t!='ocean'&&!tg.has(c));if(p){a.path=p;tg.add(p[p.length-1])}})}
function trade(r,d){const n=S.n[0],p=price(r)*(d>0?1:.8);if(d>0){if(n.g<p)return toast('Not enough gold');n.g-=p;n[r]+=10}else{if(n[r]<10)return toast('Not enough '+r);n[r]-=10;n.g+=Math.round(p);S.mk.s[r]++}}
function endTurn(){if(!S||S.over||S.setup)return;const me=S.n[0];applyInc(me);me.rp+=4+lordRp(me);S.a.filter(a=>a.o==0).forEach(step);S.sh.filter(z=>z.o==0).forEach(stepShip);S.n.forEach(n=>{if(n.id&&!n.dead)ai(n)});S.a.filter(a=>a.o!=0).forEach(step);strand();settle();S.p.forEach(p=>{const v=p.v;if(v&&v.q&&v.q.length){v.q.forEach(q=>q.t--);v.q.filter(q=>q.t<=0).forEach(q=>{v.b.push(q.k);if(p.o==0)lg(`${BLD[q.k].n} completed at ${p.nm}.`)});v.q=v.q.filter(q=>q.t>0)}});
 for(const r of['f','i','w']){S.mk.u[r]=S.mk.s[r]>0?0:Math.min(30,S.mk.u[r]+1);S.mk.s[r]=0}
 S.n.forEach(n=>{for(const j in n.tr)if(n.tr[j]>0)n.tr[j]--;for(const j in n.war)n.war[j]++});S.turn++;
 if(S.turn%4==0)S.n.forEach(n=>{n.k.forEach(k=>k.a++);if((n.id||n.sp)&&!n.dead&&n.k.length<8&&Math.random()<.35)n.k.push({nm:rn(KM),m:Math.random()<.5?1:0,a:0,s:null})});
 save(0,1);checkEnd();tl=S.timer||0;render()}
function checkEnd(){if(S.over)return;const land=S.p.filter(p=>p.t!='ocean').length,m=tilesOf(0).length,mv=m+S.n.filter(n=>n.lord===0&&!n.dead).reduce((q,n)=>q+tilesOf(n.id).length,0);if(!m){S.over=1;fin(0)}else if(mv/land>=.5||S.n.every(n=>n.id==0||n.dead)){S.over=1;fin(1)}}
function fin(w){$('ov').style.display='flex';$('ov').innerHTML=`<div><h3>${w?'Victory!':'Your realm has fallen'}</h3><p>${w?'Half the known lands bow to your crown.':'Your last village is lost.'}</p><button onclick="menu()">New game</button> ${w?'<button onclick="$(\'ov\').style.display=\'none\'">Keep playing</button>':''}</div>`}
function act(a,x){const n=S.n[0],p=sel!=null?S.p[sel]:null,A=S.a.find(z=>z.id==selA);
 if(a=='found'){if(p.o==0&&!p.v&&p.t!='ocean'&&can(n,{g:60,w:20},1)){pay(n,{g:60,w:20},1);p.v={b:[]};S.lq.push(sel)}else toast('Need an owned land tile, 🪙60 🪵20')}
 else if(a=='bld'){const B=BLD[x];if(used(p.v)<slots(p.v)&&can(n,B.c,1)){pay(n,B.c,1);(p.v.q=p.v.q||[]).push({k:x,t:B.t});toast(B.n+' ready in '+B.t+' seasons')}else toast('Cannot build')}
 else if(a=='rec'){const u=U[x],b=u.boat?1:5;if(!p.v||p.o!=0)return;if(u.boat&&!coast(sel))return toast('Boats need a coastal village');if(!can(n,u.c,b))return toast('Not enough resources');pay(n,u.c,b);selA=addUnits(0,sel,x,b).id}
 else if(a=='split'&&A){const o={};let k=0;for(const t in A.army){const e=$('sp_'+t),v=e?Math.min(A.army[t],Math.max(0,+e.value||0)):0;if(v){o[t]=v;k+=v}}if(!k||k>=sum(A.army))return toast('Pick some (not all) units to split');
  const B={id:S.nid++,o:0,at:A.at,army:{levy:0,spear:0,archer:0,knight:0},path:[],cap:null};for(const t in o){A.army[t]-=o[t];B.army[t]=o[t]}S.a.push(B);selA=B.id}
 else if(a=='merge'){const l=S.a.filter(z=>z.o==0&&z.at==sel);if(l.length>1){const m=l[0];l.slice(1).forEach(z=>{for(const t in z.army)m.army[t]+=z.army[t];kill(z)});m.path=[];selA=m.id}}
 else if(a=='disb'&&A&&confirm('Disband this army?'))kill(A);
 else if(a=='gift'){if(n.g<40)return toast('Not enough gold');n.g-=40;clampRel(n,S.n[x],15)}
 else if(a=='ally'){const o=S.n[x];if(n.rel[x]>=(n.t.courts?25:35)&&o.war[0]==null){n.al[x]=o.al[0]=true;lg(`Alliance sworn with ${o.nm}.`)}else toast('They do not trust you enough (relations 35+, 25+ with Royal Courts)')}
 else if(a=='unal'){if(S.n[x].lord===0)S.n[x].lord=null;delete n.al[x];delete S.n[x].al[0];clampRel(n,S.n[x],-20)}
 else if(a=='war'){if(confirm('Declare war on '+S.n[x].nm+'?'))declare(0,x)}
 else if(a=='peace'){const o=S.n[x];if(pwr(n)>pwr(o)*1.1||n.war[x]>=6||Math.random()<.25){setPeace(0,x);lg(`Peace with ${o.nm}.`)}else toast('They refuse to lay down arms')}
 else if(a=='marry'){const o=S.n[x],k=n.k[+$('mk'+x).value],tk=o.k.find(z=>z.m!=k.m&&z.a>=14&&z.s==null);if(!tk)return toast('They have no suitable royal spouse');if(n.g<50)return toast('Need 50 gold dowry');n.g-=50;
  if(Math.random()<.3+n.rel[x]/200+(n.t.courts?.15:0)){k.s=x;tk.s=0;n.al[x]=o.al[0]=true;clampRel(n,o,35);lg(`${k.nm} weds ${tk.nm} of ${o.nm}. A dynastic alliance is forged!`)}else{clampRel(n,o,-5);toast('The proposal was declined')}}
 else if(a=='marryR'){const o=S.n[x],tk=o.k.find(z=>z.m!=n.rm&&z.a>=14&&z.s==null);if(n.sp)return toast('You are already married');if(o.war[0]!=null)return toast('They are at war with you');if(!tk)return toast('They have no suitable royal to wed');if(n.g<50)return toast('Need 50 gold');n.g-=50;
  if(Math.random()<.35+n.rel[x]/200+(n.t.courts?.15:0)){n.sp={nm:tk.nm,from:x};tk.s=0;n.al[x]=o.al[0]=true;clampRel(n,o,35);lg(`${n.ru} weds ${tk.nm} of ${o.nm}. A dynastic alliance is forged!`)}else{clampRel(n,o,-5);toast('The proposal was declined')}}
 else if(a=='vas'){const o=S.n[x];if(o.war[0]!=null||o.lord!=null)return toast('Not possible right now');if(pwr(n)>=pwr(o)*2||(n.rel[x]>=60&&Math.random()<.4)){o.lord=0;n.al[x]=o.al[0]=true;lg(`${o.nm} swears fealty to ${n.nm}.`)}else toast('They refuse to kneel')}
 else if(a=='free'){S.n[x].lord=null;delete n.al[x];delete S.n[x].al[0]}
 else if(a=='upg'){const v=p.v,l=v&&v.l||0;if(!v||p.o!=0||l>=3||!can(n,UPC[l],1))return toast('Cannot upgrade');pay(n,UPC[l],1);v.l=l+1;lg(`${p.nm} grows into a ${LV[l+1].toLowerCase()}.`)}
 else if(a=='spy'){if(n.g<40)return toast('Not enough gold');n.g-=40;S.intel=S.intel||{};S.intel[x]=S.turn;toast('Spies report on '+S.n[x].nm+' (this season)')}
 else if(a=='marryL'){const t=S.p[x],lo=t.v&&t.v.lord;if(!lo||n.sp||lo.s!=null||(lo.m!==0?1:0)==n.rm)return toast('Cannot marry them');n.sp={nm:lo.nm,from:-1,vil:x};lo.s='ruler';lg(`${n.ru} weds ${lo.nm}, lord of ${t.nm}. The vassal joins the royal house.`)}
 else if(a=='marryLK'){const t=S.p[x],lo=t.v&&t.v.lord,k=n.k[+$('lk'+x).value];if(!lo||!k||lo.s!=null||k.s!=null)return toast('Cannot wed them');k.s=-1;k.v=lo.nm;lo.s='kid';lg(`${k.nm} weds ${lo.nm}, lord of ${t.nm}.`)}
 else if(a=='capt'&&A){if(capable(A)&&!A.path.length){A.cap=3;toast('Capture begins: 3 seasons. Keep the army here.')}else toast('Nothing to capture here')}
 else if(a=='ccap'&&A){A.cap=null}
 else if(a=='ship'){if(!p||p.o!=0||!p.v||!coast(sel))return toast('Needs a coastal village');if(!can(n,SHC,1))return toast('Not enough resources');const oc=nb(sel).filter(j=>S.p[j].t=='ocean'),hostile=(x,j)=>x.at==j&&x.o!=0&&n.war[x.o]!=null;let fr=oc.find(j=>!S.a.some(x=>hostile(x,j))&&!S.sh.some(x=>hostile(x,j)));if(fr===undefined)fr=oc[0];pay(n,SHC,1);const z={id:S.nid++,o:0,at:fr,lv:0,path:[]};S.sh.push(z);selS=z.id;toast('Boat launched')}
 else if(a=='supg'){const z=S.sh.find(x=>x.id==selS);if(!z||z.o!=0)return;const lv=z.lv||0;if(lv>=3||!nb(z.at).some(j=>S.p[j].o==0&&S.p[j].v)||!can(n,SHUP[lv],1))return toast('Cannot upgrade here');pay(n,SHUP[lv],1);z.lv=lv+1;lg(`A boat can now carry ${CAP[lv+1]} units.`)}
 else if(a=='sdis'){const z=S.sh.find(x=>x.id==selS);if(z&&!S.a.some(x=>x.at==z.at&&x.o==0))S.sh=S.sh.filter(x=>x!==z);selS=null}
 else if(a=='tech'){const t=TECH.find(z=>z.id==x);if(n.rp>=t.c){n.rp-=t.c;n.t[x]=true;lg('Researched '+t.n)}}
 else if(a=='fund'){if(n.g>=20){n.g-=20;n.rp+=10}}
 render()}

function pTile(){const n=S.n[0];if(sel==null)return'<p class=m>Drag the map to pan, wheel/+− to zoom. Tap a tile. Drag one of your army tokens onto any tile to order a march.</p>';

function pDip(){const n=S.n[0];let h='';S.n.forEach(o=>{if(!o.id||o.dead)return;const w=n.war[o.id]!=null,a=n.al[o.id],tr=n.tr[o.id]>0;

 const ks=n.k.map((k,i)=>k.a>=14&&k.s==null?`<option value=${i}>${esc(k.nm)} (${k.m?'prince':'princess'}, ${k.a})</option>`:'').join('');if(!w&&ks)h+=`<br><select id="mk${o.id}">${ks}</select><button onclick="act('marry',${o.id})">Marry 🪙50</button>`;h+='</div>'});

 if(!sp){h+='<b>Seek a spouse</b>';S.n.forEach(o=>{if(!o.id||o.dead)return;const tk=o.k.find(z=>z.m!=n.rm&&z.a>=14&&z.s==null);h+=`<div class=c><b style="color:${o.col}">${esc(o.nm)}</b> <span class=m>relations ${Math.round(n.rel[o.id])} · ${tk?esc(tk.nm)+', age '+tk.a:'no suitable royal'}</span><br><button ${tk&&o.war[0]==null?'':'disabled'} onclick="act('marryR',${o.id})">Propose marriage 🪙50</button></div>`})}

function hex(i){const[cx,cy]=ctr(i);let s='';for(let k=0;k<6;k++){const a=Math.PI/180*(60*k+30);s+=(cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1)+' '}return s}

 $('vp').innerHTML=h+'<circle id="gh" r="9" fill="#fff" opacity=".7" pointer-events="none" display="none"/>'}
function setVp(){$('vp').setAttribute('transform',`translate(${vp.x} ${vp.y}) scale(${vp.k})`)}
function zoom(f,mx,my){const r=$('map').getBoundingClientRect();mx=mx??r.width/2;my=my??r.height/2;const k=Math.max(.12,Math.min(4,vp.k*f)),g=k/vp.k;vp.x=mx-(mx-vp.x)*g;vp.y=my-(my-vp.y)*g;vp.k=k;setVp()}
